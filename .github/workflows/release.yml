# Wheels + sdist on version tags (v*) and on manual dispatch. See docs/ci.md.
#
#   build-linux   manylinux x86_64 and aarch64 (abi3-py310: one wheel per platform)
#   build-macos   macOS arm64, for developers
#   sdist
#   test          installs the x86_64 Linux and macOS wheels, runs the synthetic tests
#   github-release  tags only: attaches wheels, sdist and SHA256SUMS to the release
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare tag with python/pyproject.toml and python/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          py = tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"]
          rs = tomllib.load(open("python/Cargo.toml", "rb"))["package"]["version"]
          print(f"tag {tag}, pyproject {py}, Cargo {rs}")
          if not tag == py == rs:
              print("::error::tag, python/pyproject.toml and python/Cargo.toml versions must match")
              sys.exit(1)
          EOF

  build-linux:
    name: manylinux ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist -m python/Cargo.toml
      - name: Check license files
        run: python scripts/check_dist_licenses.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    name: macOS arm64
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --locked --out dist -m python/Cargo.toml
      - name: Check license files
        run: python scripts/check_dist_licenses.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - name: Check license files
        run: python scripts/check_dist_licenses.py dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The aarch64 Linux wheel is built but not executed here (no arm64 runner
  # assumed); see docs/ci.md.
  test:
    name: Test wheel (${{ matrix.os }})
    needs: [build-linux, build-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
          - os: macos-latest
            artifact: wheels-macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install and run the synthetic tests
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install "androguard==4.1.3" "mutf8==1.1.0" pytest dist/*.whl
          .venv-test/bin/python -m pytest python/tests -rs -p no:cacheprovider

  github-release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, sdist, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
