# Build, test and fuzz-smoke on every push and pull request. See docs/ci.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust build, test, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --locked
      # androguard-rs-py (the PyO3 extension) only links under maturin; it has
      # no Rust tests and is exercised by the pytest job instead.
      - name: cargo test --workspace
        run: cargo test --workspace --exclude androguard-rs-py --release --locked
      # Not -D warnings: clippy isn't clean yet (useless vec!, collapsible if,
      # ...). Warnings show in the log and as annotations but don't fail CI.
      # Switch to `-- -D warnings` once they're fixed.
      - name: cargo clippy (warnings allowed)
        run: cargo clippy --workspace --all-targets --locked

  python:
    name: Wheel + pytest (synthetic, no APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: maturin build
        run: |
          python -m pip install "maturin>=1.15,<2"
          maturin build --release --locked -m python/Cargo.toml --out dist
      - name: Check license files in the wheel
        run: python scripts/check_dist_licenses.py dist/*.whl
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install "androguard==4.1.3" "mutf8==1.1.0" pytest dist/*.whl
      # Without PARITY_APKS the APK parity tests skip; everything synthetic
      # (mutf8, text, maplist, model_hostile, synthetic/mutant resources) runs.
      - name: pytest python/tests
        run: .venv-test/bin/python -m pytest python/tests -rs -p no:cacheprovider
      # The same wheel without androguard: the androguard-dependent modules
      # are skipped (python/tests/conftest.py), the goldens-based ones run.
      - name: pytest python/tests (without androguard)
        run: |
          python -m venv .venv-noag
          .venv-noag/bin/python -m pip install pytest dist/*.whl
          .venv-noag/bin/python -m pytest python/tests -rs -p no:cacheprovider
      - uses: actions/upload-artifact@v7
        with:
          name: ci-wheel-linux-x86_64
          path: dist/*.whl
          retention-days: 7

  fuzz-smoke:
    name: Fuzz smoke (nightly, 60 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          cache-all-crates: true
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: cargo +nightly fuzz build -a
        run: cargo +nightly fuzz build -a
      # Tiny synthetic seeds (dexbuild.py's DEX, a minimal resources.arsc,
      # zips of both); nothing binary is committed.
      - name: Generate seed corpora
        run: python3 scripts/ci_fuzz_seeds.py fuzz/corpus
      - name: Run each target for 60 s
        run: |
          failed=""
          for t in dex_pipeline decode text apk arsc axml apkzip; do
            echo "::group::$t"
            if ! cargo +nightly fuzz run -a "$t" "fuzz/corpus/$t" -- \
                 -max_total_time=60 -max_len=65536 -rss_limit_mb=2048 -timeout=10; then
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed (crash inputs are in the fuzz-artifacts upload)"
            exit 1
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
