[package]
name = "androguard-core"
version = "0.1.1"
edition = "2024"
description = "Low-memory DEX parsing, whole-APK xref index and androguard-4.1.3-compatible rendering"
license = "Apache-2.0"
repository = "https://github.com/Tanay-27/androguard-rs"
publish = false

[lib]
name = "androguard_core"

[dependencies]
anyhow = "1.0.104"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.3"
rayon = "1.12.0"
rustc-hash = "2.1.3"
dex-bytecode = { path = "../vendor/dex-bytecode" }
