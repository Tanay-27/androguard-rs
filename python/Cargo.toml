[package]
name = "androguard-rs-py"
version = "0.1.2"
edition = "2024"
description = "PyO3 bindings for androguard-rs (the androguard_rs Python package)"
license = "Apache-2.0"
repository = "https://github.com/Tanay-27/androguard-rs"
publish = false

[lib]
name = "androguard_rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
androguard-core = { path = "../core" }
dex-bytecode = { path = "../vendor/dex-bytecode" }
rustc-hash = "2.1.3"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
